{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card" style="background-color: #1a1a1a; border: 1px solid #6B21A8; border-radius: 20px;">
                <div class="card-body p-5">
                    <h3 class="text-center fw-bold mb-4" style="font-family: 'Syne', sans-serif; color: #4ADE80;">Área Admin</h3>
                    {% if error %}
                    <div class="alert alert-danger" style="background-color: #2a1a1a; border-color: #ef4444; color: #ef4444;">
                        {{ error }}
                    </div>
                    {% endif %}
                    <form method="POST" action="{{ url_for('admin_login_post') }}">
                        <div class="mb-3">
                            <label class="form-label" style="color: #d4d4d8; font-family: 'Inter', sans-serif;">Usuário</label>
                            <input type="text" class="form-control" name="username" placeholder="Username" required style="background-color: #2a2a2a; border: 1px solid #6B21A8; color: #fff;">
                        </div>
                        <div class="mb-4">
                            <label class="form-label" style="color: #d4d4d8; font-family: 'Inter', sans-serif;">Senha</label>
                            <input type="password" class="form-control" name="password" placeholder="Password" required style="background-color: #2a2a2a; border: 1px solid #6B21A8; color: #fff;">
                        </div>
                        <button type="submit" class="btn w-100" style="background-color: #6B21A8; color: #fff; border: none; font-weight: 600; font-family: 'Inter', sans-serif;">Entrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
