<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Açaí do João - Delivery em Salvador/BA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #0D0D0D; border-bottom: 2px solid #6B21A8;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" style="font-family: 'Syne', sans-serif; color: #4ADE80;">Açaí do João</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#cardapio">Cardápio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#carrinho" style="color: #6B21A8;">Carrinho (<span id="nav-cart-count">0</span>)</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block hero %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block footer %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
